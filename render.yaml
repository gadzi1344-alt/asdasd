services:
  - type: web
    name: pearwallet
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
    healthCheckPath: /api/health
      - key: BOT_TOKEN
        sync: false
      - key: BOT_API_URL
        value: https://api.telegram.org
